name: BranchScope checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Check the collector
        run: node --test research/m2-prototype/parser.test.cjs research/m2-prototype/probe.test.cjs research/m2-prototype/observe.test.cjs
      - name: Install and verify extension
        working-directory: extension
        run: |
          npm.cmd ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd run build
          exit $LASTEXITCODE
      - name: Install Chromium
        working-directory: extension
        run: npm.cmd exec -- playwright install chromium --no-shell
      - name: Test synthetic map
        working-directory: extension
        env:
          M1_BROWSER: chromium
        run: npm.cmd run test:e2e
      - name: Test the built MV3 extension
        working-directory: extension
        run: npm.cmd run test:extension
